name: Build and publish Docker image

# Builds Dockerfile and pushes to GitHub Container Registry (ghcr.io)
# on every push to main, using the repo-scoped GITHUB_TOKEN GitHub
# provides automatically — no Docker Hub account or extra secret
# needed. Judges can then run the whole demo stack locally with:
#
#   docker run --rm -p 3000:3000 -p 3001:3001 -p 3002:3002 \
#     ghcr.io/<owner>/<repo>:latest
#
# as a convenience alongside the required live URL, not instead of it.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the image name
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}:latest
            ghcr.io/${{ steps.image.outputs.name }}:${{ github.sha }}
