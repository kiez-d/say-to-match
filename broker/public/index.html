<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebMCP Labor Index — Broker</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d10; --panel: #12151a; --panel2: #171b22; --line: #232833;
    --fg: #e6e9ef; --muted: #8891a3; --accent: #6ea8fe; --good: #3ecf7a;
    --bad: #ff6b6b; --warn: #f5b942;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Liberation Sans", sans-serif;
  }
  header {
    padding: 1rem 1.5rem; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap;
  }
  header h1 { font-size: 1.1rem; margin: 0; }
  header .sub { color: var(--muted); font-size: .85rem; }
  .layout {
    display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 1px;
    background: var(--line); min-height: calc(100vh - 58px);
  }
  .col { background: var(--bg); display: flex; flex-direction: column; min-width: 0; }
  .col h2 {
    font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
    margin: 0; padding: .7rem 1rem; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  iframe { flex: 1; border: 0; width: 100%; min-height: 320px; background: white; }
  .controls { padding: 1rem; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; gap: .6rem; flex-wrap: wrap; }
  button {
    background: var(--accent); color: #071018; border: 0; border-radius: 8px;
    padding: .6rem 1rem; font-weight: 600; font-size: .85rem; cursor: pointer;
  }
  button.secondary { background: #3a2a1a; color: #f5b942; }
  button:disabled { opacity: .5; cursor: default; }
  #log {
    flex: 1; overflow-y: auto; padding: 1rem; font: 12.5px/1.55 ui-monospace, "SF Mono", Menlo, "Liberation Mono", monospace;
  }
  .line { padding: .28rem .5rem; border-radius: 6px; margin-bottom: .2rem; }
  .line .t { color: var(--muted); margin-right: .5rem; }
  .line.tier1_pass, .line.tier2_pass, .line.settlement_release { background: rgba(62,207,122,.1); color: var(--good); }
  .line.tier1_fail, .line.tier2_fail, .line.settlement_reject { background: rgba(255,107,107,.1); color: var(--bad); }
  .line.security { background: rgba(245,185,66,.12); color: var(--warn); }
  .line.phase { color: var(--accent); font-weight: 600; }
  .line.webmcp_console { color: #9fb6ff; }
  pre.data { margin: .25rem 0 .5rem 1.6rem; padding: .5rem .7rem; background: var(--panel2); border-radius: 6px; font-size: 11.5px; overflow-x: auto; color: var(--muted); }
  #ledger { padding: 1rem; border-top: 1px solid var(--line); background: var(--panel); font-size: .82rem; }
  .entry { display: flex; justify-content: space-between; padding: .35rem 0; border-bottom: 1px dashed var(--line); }
  .status-held { color: var(--warn); } .status-released { color: var(--good); } .status-rejected { color: var(--bad); }
</style>
</head>
<body>

<header>
  <h1>🏦 WebMCP Labor Index — Broker</h1>
  <span class="sub">watching two independent origins via a real headless-browser agent, not internal API calls</span>
</header>

<div class="layout">
  <div class="col">
    <h2 id="requester-label">Requester origin</h2>
    <iframe id="requester-frame" title="requester"></iframe>
  </div>

  <div class="col">
    <h2>Broker Console</h2>
    <div class="controls">
      <button id="run-clean">▶ Run Full Demo</button>
      <button id="run-adv" class="secondary">⚠ Run Adversarial Demo</button>
    </div>
    <div id="log"></div>
    <div id="ledger"><strong>Escrow Ledger</strong><div id="ledger-body"></div></div>
  </div>

  <div class="col">
    <h2 id="worker-label">Worker origin</h2>
    <iframe id="worker-frame" title="worker"></iframe>
  </div>
</div>

<script>
  const logEl = document.getElementById("log");
  const ledgerBody = document.getElementById("ledger-body");
  const runClean = document.getElementById("run-clean");
  const runAdv = document.getElementById("run-adv");

  function line(evt) {
    const div = document.createElement("div");
    div.className = "line " + evt.type;
    const time = new Date(evt.at).toLocaleTimeString();
    div.innerHTML = '<span class="t">' + time + '</span>' + escapeHtml(evt.message);
    logEl.appendChild(div);
    if (evt.data && Object.keys(evt.data).length) {
      const pre = document.createElement("pre");
      pre.className = "data";
      pre.textContent = JSON.stringify(evt.data, null, 2).slice(0, 1200);
      logEl.appendChild(pre);
    }
    logEl.scrollTop = logEl.scrollHeight;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  async function refreshLedger() {
    const entries = await fetch("/api/ledger").then((r) => r.json());
    ledgerBody.innerHTML = entries
      .map(
        (e) =>
          '<div class="entry"><span>' +
          e.job_id +
          " — $" +
          e.bounty_usd +
          '</span><span class="status-' +
          e.status +
          '">' +
          e.status +
          "</span></div>"
      )
      .join("") || '<div class="entry"><span>no runs yet</span></div>';
  }

  async function run(adversarial) {
    runClean.disabled = true;
    runAdv.disabled = true;
    logEl.innerHTML = "";
    try {
      await fetch("/api/run-demo", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ adversarial }),
      });
    } catch (e) {
      line({ type: "run_error", message: "Request failed: " + e.message, at: new Date().toISOString() });
    }
    runClean.disabled = false;
    runAdv.disabled = false;
    refreshLedger();
  }

  runClean.addEventListener("click", () => run(false));
  runAdv.addEventListener("click", () => run(true));

  const es = new EventSource("/events");
  es.onmessage = (e) => line(JSON.parse(e.data));

  refreshLedger();

  fetch("/api/config")
    .then((r) => r.json())
    .then(({ requesterUrl, workerUrl }) => {
      document.getElementById("requester-frame").src = requesterUrl;
      document.getElementById("worker-frame").src = workerUrl;
      document.getElementById("requester-label").textContent =
        "Requester origin · " + new URL(requesterUrl).host;
      document.getElementById("worker-label").textContent =
        "Worker origin · " + new URL(workerUrl).host;
    })
    .catch(() => {});
</script>

</body>
</html>
